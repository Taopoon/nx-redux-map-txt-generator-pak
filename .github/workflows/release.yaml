---
name: "release"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Bump type"
        default: "patch"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  attestations: write
  id-token: write
  contents: write

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next-tag.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Get Latest Tag
        id: latest-tag
        run: |
          echo GIT_LATEST_TAG="$(git describe --tags "$(git rev-list --tags --max-count=1)")" >>"$GITHUB_OUTPUT"

      - name: Compute Next Tag
        id: next-tag
        uses: docker://ghcr.io/dokku/semver-generator:latest
        with:
          bump: ${{ github.event.inputs.bump_type }}
          input: ${{ steps.latest-tag.outputs.GIT_LATEST_TAG }}

  native:
    uses: ./.github/workflows/native.yaml

  build:
    name: build
    runs-on: ubuntu-24.04-arm
    needs:
      - version
      - native

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Download nxlist binaries
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: nxlist-*
          path: native-artifacts

      - name: Place nxlist binaries
        run: |
          make clean
          for p in tg5040 tg5050; do
            mkdir -p "bin/$p"
            cp "native-artifacts/nxlist-$p/nxlist.elf" "bin/$p/nxlist.elf"
            chmod +x "bin/$p/nxlist.elf"
          done

      - name: Create release
        run: |
          make build release
          for p in tg5040 tg5050; do cp "bin/$p/nxlist.elf" "dist/nxlist-$p.elf"; done
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}

      - name: Get Pak Name
        id: pak-name
        run: |
          echo "PAK_NAME=$(jq -r .name pak.json)" >> $GITHUB_OUTPUT

      # attestations are not available on user-owned private repos
      - name: Attest Build Provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5.0.0
        with:
          name: "${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"
          path: "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"

  release:
    name: release
    runs-on: ubuntu-24.04
    needs:
      - version
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Get Pak Name
        id: pak-name
        run: |
          echo "PAK_NAME=$(jq -r .name pak.json)" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: "${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"
          path: "dist"

      - name: Validate Artifact exists
        run: |
          if [ ! -f "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip" ]; then
            echo "Artifact does not exist"
            exit 1
          fi

      - name: Create and Push Tag
        run: |
          make bump-version
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pak.json
          # pak.json may already carry this version (bumped by hand): tag anyway
          git diff --cached --quiet || git commit -m "Release $RELEASE_VERSION"
          git tag "$RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"
          git push origin main
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}

      - name: Release
        uses: softprops/action-gh-release@v2.4.2
        with:
          files: dist/*
          generate_release_notes: true
          make_latest: "true"
          tag_name: ${{ needs.version.outputs.version }}
